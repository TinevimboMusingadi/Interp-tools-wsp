[project]
name = "wsp"
version = "0.0.1"
description = "Interpretability tools as the harness for weight-space programming."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    # Install from the local fork checkout (feat/tpu-eager) until the TPU PR is released:
    #   pip install -e D:/interp-engine
    "interp-engine>=1.14",
    "torch>=2.4",
    "transformers>=5.0",
    "numpy>=1.24",
    "pyyaml>=6",
    "datasets>=2.19",            # MATH-500, GSM8K, IFEval and practice sets
]

[project.optional-dependencies]
agents = [
    "anthropic[vertex]>=0.70",   # Claude via Google Cloud Vertex AI
    "google-genai>=1.0",         # Gemini API
]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wsp*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a downloaded HF model (slow)"]
