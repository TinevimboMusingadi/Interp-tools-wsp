# USD per million tokens (output includes thinking tokens). A model is used for paid runs only when
# its row says verified: true. The ledger refuses any model missing from this table.
models:
  # Gemini via Vertex AI (project tpu-builder1). Source: aistudio.google.com/docs/pricing, read 2026-11-08.
  # gemini-3.8-flash doubles to 1.50 / 7.50 from 2027-01-01: update this row before running after that date.
  gemini-3.8-flash:       {input_per_mtok: 0.75, output_per_mtok: 3.75, verified: true}
  gemini-3.1-pro-preview: {input_per_mtok: 2.0,  output_per_mtok: 12.0, verified: true}
  # Gemini 4, read 2026-11-13 (same page). Argon and Carbon double to 4.00 / 20.00 from 2026-12-01.
  gemini-4-carbon:        {input_per_mtok: 2.0,  output_per_mtok: 10.0, verified: true}
  gemini-4-argon:         {input_per_mtok: 2.0,  output_per_mtok: 10.0, verified: true}
  gemini-4-hydrogen:      {input_per_mtok: 1.5,  output_per_mtok: 7.5,  verified: true}
  # Claude via Vertex AI. Anthropic list prices from the claude-api reference (2026-11-03 table): Opus 5.5
  # 4 / 20, cache reads 0.20; Sonnet 5.5 2 / 10, cache reads 0.10; 5-minute cache writes are 1.25x input.
  # Vertex bills Claude itself and its page could not be read here: confirm against the GCP billing
  # report after the smoke cell, then set verified: true. Unverified rows only run with --allow-unverified.
  claude-sonnet-5-5:      {input_per_mtok: 2.0,  output_per_mtok: 10.0, cache_read_per_mtok: 0.10, cache_write_per_mtok: 2.5, verified: false}
  claude-opus-5-5:        {input_per_mtok: 4.0,  output_per_mtok: 20.0, cache_read_per_mtok: 0.20, cache_write_per_mtok: 5.0, verified: false}
  # Offline fake provider used by tests and dry runs
  fake:                   {input_per_mtok: 0.0,  output_per_mtok: 0.0, verified: true}
